name = "lumiere"
main = "src/index.js"
compatibility_date = "2026-10-16"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"

# Launch-list signups. Create the namespace once, then uncomment and paste the id:
#   npx wrangler kv namespace create NOTIFY
# [[kv_namespaces]]
# binding = "NOTIFY"
# id = ""

[build]
command = "npm run build"
